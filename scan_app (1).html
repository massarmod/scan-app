<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>سكان الباركود</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Tahoma, Arial, sans-serif; background: #0f172a; color: #fff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 16px; }
  h1 { font-size: 20px; margin-bottom: 4px; color: #f8fafc; }
  .subtitle { font-size: 12px; color: #94a3b8; margin-bottom: 14px; }
  .screen { width: 100%; max-width: 400px; display: none; flex-direction: column; align-items: center; }
  .screen.active { display: flex; }
  .session-list { width: 100%; margin-top: 10px; }
  .session-card { background: #1e293b; border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; border: 1px solid #334155; }
  .session-card:active { border-color: #3b82f6; }
  .session-name { font-weight: 700; font-size: 15px; color: #93c5fd; }
  .session-meta { font-size: 12px; color: #64748b; margin-top: 3px; }
  .session-right { display: flex; align-items: center; gap: 10px; }
  .session-count { font-size: 22px; font-weight: 800; color: #3b82f6; }
  .btn-del { background: none; border: none; color: #ef4444; font-size: 18px; cursor: pointer; padding: 4px 8px; }
  .btn-new { width: 100%; background: #3b82f6; color: #fff; border: none; border-radius: 12px; padding: 14px; font-size: 16px; font-weight: 700; cursor: pointer; margin-bottom: 16px; }
  #video-container { width: 100%; max-width: 360px; border-radius: 16px; overflow: hidden; border: 3px solid #3b82f6; position: relative; background: #000; }
  #video-container video { width: 100%; display: block; }
  #scan-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 220px; height: 220px; border: 3px solid #3b82f6; border-radius: 12px; box-shadow: 0 0 0 9999px rgba(0,0,0,0.4); pointer-events: none; }
  .controls { display: flex; gap: 10px; margin-top: 10px; width: 100%; max-width: 360px; }
  .btn-flash { flex: 1; background: #1e293b; color: #fbbf24; border: 1px solid #fbbf24; border-radius: 10px; padding: 10px; font-size: 14px; cursor: pointer; font-weight: 600; }
  .btn-flash.on { background: #fbbf24; color: #000; }
  .btn-end { flex: 1; background: #1e293b; color: #f87171; border: 1px solid #f87171; border-radius: 10px; padding: 10px; font-size: 14px; cursor: pointer; font-weight: 600; }
  .status { margin-top: 10px; font-size: 15px; padding: 12px 20px; border-radius: 12px; text-align: center; width: 100%; max-width: 360px; font-weight: 600; transition: all 0.3s; }
  .status.waiting { background: #1e293b; color: #94a3b8; }
  .status.saving { background: #1d4ed8; color: #fff; }
  .status.success { background: #15803d; color: #fff; }
  .status.error { background: #b91c1c; color: #fff; }
  .status.duplicate { background: #92400e; color: #fff; }
  .last-scan { margin-top: 8px; font-size: 12px; color: #64748b; text-align: center; direction: ltr; word-break: break-all; }
  .counter { margin-top: 12px; font-size: 28px; font-weight: 800; color: #3b82f6; }
  .counter-label { font-size: 12px; color: #64748b; margin-top: 2px; }
  .log { margin-top: 12px; width: 100%; max-width: 360px; max-height: 160px; overflow-y: auto; }
  .log-item { border-radius: 8px; padding: 8px 12px; margin-bottom: 5px; font-size: 12px; direction: ltr; display: flex; justify-content: space-between; align-items: center; }
  .log-item.normal { background: #1e293b; }
  .log-item.dup { background: #451a03; border: 1px solid #92400e; }
  .log-item .barcode { color: #93c5fd; font-weight: 600; }
  .log-item.dup .barcode { color: #fbbf24; }
  .log-item .time { color: #475569; font-size: 11px; }
  .summary-box { background: #1e293b; border-radius: 14px; padding: 20px; width: 100%; margin-bottom: 14px; text-align: center; }
  .summary-title { font-size: 18px; font-weight: 800; color: #93c5fd; margin-bottom: 6px; }
  .summary-count { font-size: 40px; font-weight: 900; color: #3b82f6; }
  .summary-sub { font-size: 13px; color: #64748b; margin-top: 4px; }
  .btn-back { width: 100%; background: #1e293b; color: #94a3b8; border: 1px solid #334155; border-radius: 12px; padding: 12px; font-size: 14px; cursor: pointer; margin-bottom: 10px; }
  .detail-log { width: 100%; max-height: 300px; overflow-y: auto; }
  .modal-overlay { position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 999; }
  .modal { background: #1e293b; border-radius: 16px; padding: 24px; width: 90%; max-width: 340px; }
  .modal h3 { font-size: 17px; margin-bottom: 14px; color: #f8fafc; text-align: center; }
  .modal input { width: 100%; background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 12px; font-size: 15px; color: #fff; margin-bottom: 14px; text-align: center; }
  .modal-btns { display: flex; gap: 10px; }
  .modal-btns button { flex: 1; padding: 12px; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; border: none; }
  .btn-confirm { background: #3b82f6; color: #fff; }
  .btn-cancel-modal { background: #334155; color: #94a3b8; }
</style>
</head>
<body>
<h1>📦 سكان الباركود</h1>
<p class="subtitle">سكان متواصل — يحفظ تلقائياً في Sheets</p>

<div class="screen active" id="homeScreen">
  <button class="btn-new" onclick="showNameModal()">➕ جلسة جديدة</button>
  <div style="font-size:13px;color:#64748b;margin-bottom:10px;align-self:flex-start;">الجلسات السابقة</div>
  <div class="session-list" id="sessionList"></div>
</div>

<div class="screen" id="scanScreen">
  <div style="font-size:14px;color:#93c5fd;font-weight:700;margin-bottom:10px;" id="sessionTitle"></div>
  <div id="video-container">
    <video id="video" autoplay playsinline muted></video>
    <div id="scan-overlay"></div>
  </div>
  <div class="controls">
    <button class="btn-flash" id="flashBtn" onclick="toggleFlash()">🔦 الفلاش</button>
    <button class="btn-end" onclick="endSession()">⏹️ إنهاء</button>
  </div>
  <div class="status waiting" id="status">جاري تشغيل الكاميرا...</div>
  <div class="last-scan" id="lastScan"></div>
  <div class="counter" id="counter">0</div>
  <div class="counter-label">سكان في هذه الجلسة</div>
  <div class="log" id="log"></div>
</div>

<div class="screen" id="summaryScreen">
  <div class="summary-box">
    <div class="summary-title" id="summaryTitle"></div>
    <div class="summary-count" id="summaryCount"></div>
    <div class="summary-sub" id="summaryDate"></div>
  </div>
  <button class="btn-back" onclick="showHome()">← الرجوع للرئيسية</button>
  <div style="font-size:13px;color:#64748b;margin-bottom:8px;align-self:flex-start;">تفاصيل السكان</div>
  <div class="detail-log" id="detailLog"></div>
</div>

<div class="modal-overlay" id="nameModal" style="display:none;">
  <div class="modal">
    <h3>اسم الجلسة</h3>
    <input type="text" id="sessionNameInput" placeholder="مثال: جلسة الصباح" />
    <div class="modal-btns">
      <button class="btn-cancel-modal" onclick="hideNameModal()">إلغاء</button>
      <button class="btn-confirm" onclick="startSession()">ابدأ السكان</button>
    </div>
  </div>
</div>

<!-- ZXing barcode library - much faster than html5-qrcode -->
<script src="https://unpkg.com/@zxing/library@0.19.1/umd/index.min.js"></script>
<script>
const SHEETS_URL = 'https://script.google.com/macros/s/AKfycbw-LaI4lmiOoXznovIiZRXbdRrA4Z6rFtXB3kFSp4kd4Q5uc0pzeaDrxMtdzNAE2oVrnQ/exec';

let sessions = JSON.parse(localStorage.getItem('scan_sessions') || '[]');
let currentSession = null;
let processing = false;
let flashOn = false;
let videoStream = null;
let codeReader = null;
let videoTrack = null;

// Beep
function beep(type) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    if (type === 'success') {
      osc.frequency.setValueAtTime(880, ctx.currentTime);
      osc.frequency.setValueAtTime(1100, ctx.currentTime + 0.1);
      gain.gain.setValueAtTime(0.3, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
      osc.start(); osc.stop(ctx.currentTime + 0.25);
    } else {
      osc.frequency.setValueAtTime(280, ctx.currentTime);
      gain.gain.setValueAtTime(0.4, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
      osc.start(); osc.stop(ctx.currentTime + 0.4);
    }
  } catch(e) {}
}

function saveSessions() { localStorage.setItem('scan_sessions', JSON.stringify(sessions)); }

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function showHome() {
  stopCamera();
  showScreen('homeScreen');
  renderSessions();
}

function renderSessions() {
  const el = document.getElementById('sessionList');
  if (!sessions.length) { el.innerHTML = '<div style="color:#475569;font-size:13px;text-align:center;">لا توجد جلسات بعد</div>'; return; }
  el.innerHTML = [...sessions].reverse().map((s, i) => {
    const realIdx = sessions.length - 1 - i;
    return `
    <div class="session-card" onclick="viewSession(${realIdx})">
      <div>
        <div class="session-name">${s.name}</div>
        <div class="session-meta">${s.date}</div>
      </div>
      <div class="session-right">
        <div class="session-count">${s.items.length}</div>
        <button class="btn-del" onclick="event.stopPropagation();deleteSession(${realIdx})">🗑️</button>
      </div>
    </div>`;
  }).join('');
}

function deleteSession(idx) {
  if (!confirm('حذف هذه الجلسة؟')) return;
  sessions.splice(idx, 1);
  saveSessions();
  renderSessions();
}

function showNameModal() {
  document.getElementById('sessionNameInput').value = 'جلسة ' + (sessions.length + 1);
  document.getElementById('nameModal').style.display = 'flex';
  setTimeout(() => document.getElementById('sessionNameInput').select(), 100);
}
function hideNameModal() { document.getElementById('nameModal').style.display = 'none'; }

function startSession() {
  const name = document.getElementById('sessionNameInput').value.trim() || ('جلسة ' + (sessions.length + 1));
  hideNameModal();
  const now = new Date();
  currentSession = {
    name,
    date: now.toLocaleDateString('ar-SA') + ' ' + now.toLocaleTimeString('ar-SA', {hour:'2-digit', minute:'2-digit'}),
    items: [],
    scanned: new Set()
  };
  document.getElementById('sessionTitle').textContent = '📋 ' + name;
  document.getElementById('counter').textContent = '0';
  document.getElementById('log').innerHTML = '';
  document.getElementById('lastScan').textContent = '';
  showScreen('scanScreen');
  startCamera();
}

async function startCamera() {
  setStatus('waiting', 'جاري تشغيل الكاميرا...');
  try {
    videoStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
    });
    const video = document.getElementById('video');
    video.srcObject = videoStream;
    videoTrack = videoStream.getVideoTracks()[0];

    // Use ZXing
    codeReader = new ZXing.BrowserMultiFormatReader();
    codeReader.decodeFromStream(videoStream, video, (result, err) => {
      if (result) onScanSuccess(result.getText());
    });

    setStatus('waiting', 'جاهز للسكان 📷');
  } catch(e) {
    setStatus('error', 'تعذر فتح الكاميرا');
  }
}

function stopCamera() {
  if (codeReader) { try { codeReader.reset(); } catch(e) {} codeReader = null; }
  if (videoStream) { videoStream.getTracks().forEach(t => t.stop()); videoStream = null; }
  videoTrack = null;
  flashOn = false;
  const btn = document.getElementById('flashBtn');
  if (btn) { btn.textContent = '🔦 الفلاش'; btn.classList.remove('on'); }
}

async function endSession() {
  stopCamera();
  if (currentSession && currentSession.items.length > 0) {
    sessions.push({ name: currentSession.name, date: currentSession.date, items: currentSession.items });
    saveSessions();
  }
  viewSession(sessions.length - 1);
}

function viewSession(idx) {
  const s = sessions[idx];
  if (!s) { showHome(); return; }
  document.getElementById('summaryTitle').textContent = s.name;
  document.getElementById('summaryCount').textContent = s.items.length;
  document.getElementById('summaryDate').textContent = s.date;
  document.getElementById('detailLog').innerHTML = s.items.map(item => `
    <div class="log-item normal">
      <span class="barcode">${item.barcode}</span>
      <span class="time">${item.time}</span>
    </div>
  `).join('');
  showScreen('summaryScreen');
}

async function onScanSuccess(barcode) {
  if (processing) return;
  processing = true;
  if (navigator.vibrate) navigator.vibrate(80);
  document.getElementById('lastScan').textContent = barcode;

  if (currentSession.scanned.has(barcode)) {
    beep('duplicate');
    setStatus('duplicate', '⚠️ مكرر! سبق سكانه في هذه الجلسة');
    setTimeout(() => { setStatus('waiting', 'جاهز للسكان 📷'); processing = false; }, 1500);
    return;
  }

  setStatus('saving', 'جاري الحفظ...');
  try {
    await fetch(SHEETS_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ barcode, qty: 1 }) });
    currentSession.scanned.add(barcode);
    const now = new Date();
    const timeStr = now.toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    currentSession.items.unshift({ barcode, time: timeStr });
    document.getElementById('counter').textContent = currentSession.items.length;
    renderCurrentLog();
    beep('success');
    setStatus('success', '✅ تم الحفظ!');
    setTimeout(() => { setStatus('waiting', 'جاهز للسكان التالي 📷'); processing = false; }, 700);
  } catch(e) {
    setStatus('error', '❌ فشل الحفظ');
    setTimeout(() => { setStatus('waiting', 'جاهز للسكان 📷'); processing = false; }, 2000);
  }
}

function renderCurrentLog() {
  document.getElementById('log').innerHTML = currentSession.items.map(item => `
    <div class="log-item normal">
      <span class="barcode">${item.barcode}</span>
      <span class="time">${item.time}</span>
    </div>
  `).join('');
}

async function toggleFlash() {
  if (!videoTrack) return;
  try {
    flashOn = !flashOn;
    await videoTrack.applyConstraints({ advanced: [{ torch: flashOn }] });
    const btn = document.getElementById('flashBtn');
    btn.textContent = flashOn ? '🔦 شغال' : '🔦 الفلاش';
    btn.classList.toggle('on', flashOn);
  } catch(e) {
    flashOn = false;
    alert('الفلاش غير متاح على هذا الجهاز');
  }
}

function setStatus(type, msg) {
  const el = document.getElementById('status');
  el.className = 'status ' + type;
  el.textContent = msg;
}

showHome();
</script>
</body>
</html>
